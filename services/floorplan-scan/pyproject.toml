[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "floorplan-scan"
version = "0.1.0"
description = "CubiCasa-style PNG floorplan scan for Grimoire VTT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pillow>=10",
    "opencv-python-headless>=4.10",
    "torch>=2.2",
    "torchvision>=0.17",
    "segmentation-models-pytorch>=0.3.3",
    "safetensors>=0.4",
    "pyyaml>=6",
]

[project.optional-dependencies]
serve = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]

[tool.setuptools.packages.find]
where = ["src"]
