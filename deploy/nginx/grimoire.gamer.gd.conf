# GrimoireVTT @ http://grimoire.gamer.gd/
# Copy to your server, e.g. /etc/nginx/sites-available/grimoire.gamer.gd
#
# Adjust `root` to where you cloned the repo on the VPS.

upstream grimoire_api {
  server 127.0.0.1:3001;
  keepalive 32;
}

server {
  listen 80;
  server_name grimoire.gamer.gd;

  root /var/www/grimoire-vtt/apps/client/dist;
  index index.html;

  client_max_body_size 64m;

  location /health {
    proxy_pass http://grimoire_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://grimoire_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /socket.io/ {
    proxy_pass http://grimoire_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
